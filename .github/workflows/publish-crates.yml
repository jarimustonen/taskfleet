name: Publish to crates.io

# The version tag also starts cargo-dist's independent release.yml. Neither
# workflow waits for the other. This workflow owns only release authorization,
# topology verification, and the ordered crates.io saga. Repository tests run
# locally before the wrapper creates the authorization ref and pushes the tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-authorization:
    name: protected release authorization
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Require wrapper-authorized exact-main release tag
        shell: bash
        # This job exists only for tag pushes. Manual package inspection and
        # untrusted workflows have no path to this administration credential.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/verify-release-tag-authorization.sh

  release-version:
    name: release topology and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Verify canonical topology, pins, repository, and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{print $2;exit}' Cargo.toml)"
          test "$GITHUB_REF_TYPE" != tag || test "$GITHUB_REF_NAME" = "v$version"
          repo="$(./scripts/validate-release-topology.sh)"
          cargo metadata --locked --no-deps --format-version 1 | jq -e --arg version "$version" --arg repo "https://github.com/$repo" '
            ([.packages[].name] | sort) == ["taskfleet","taskfleet-core"] and
            all(.packages[]; .version == $version and .repository == $repo) and
            ([.packages[] | select(.name == "taskfleet") | .dependencies[] |
              select(.name == "taskfleet-core" and .req == ("=" + $version))] | length) == 1
          ' >/dev/null

  package-archives:
    name: package archives (inspection only)
    needs: [release-version]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: ./scripts/publish-crates.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: taskfleet-package-archives
          path: target/package/*.crate

  publish-core:
    name: crates.io / taskfleet-core
    needs: [release-authorization, release-version]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/publish-crates.sh publish taskfleet-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: crates-io-receipt-taskfleet-core
          path: target/release-receipts/*.json

  publish-taskfleet:
    name: crates.io / taskfleet
    needs: [publish-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/publish-crates.sh publish taskfleet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: crates-io-receipt-taskfleet
          path: target/release-receipts/*.json
