[workspace]
resolver = "2"
members = ["crates/taskfleet-core", "crates/taskfleet"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jarimustonen/taskfleet"
homepage = "https://github.com/jarimustonen/taskfleet"
description = "Rust CLI for orchestrating AI-agent workflows on a developer's machine."
keywords = ["cli", "ai", "agent", "tmux", "git-worktree"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
fs4 = { version = "1", default-features = false, features = ["sync"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
insta = { version = "1", features = ["json", "filters"] }
assert_cmd = "2"
predicates = "3"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
humantime = "2"
sha2 = "0.10"
libc = "0.2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
serial_test = { version = "3", default-features = false, features = ["file_locks"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Workspace-wide lint policy. Each crate opts in with `lints.workspace = true`.
# taskfleet-core layers `missing_docs` on top via a crate-root `#![warn(missing_docs)]`
# in its lib.rs — Cargo rejects mixing `lints.workspace = true` with a per-crate
# `[lints.rust]` override in the same table, so the attribute is the clean path.
[workspace.lints.clippy]
# Pedantic is a strong default for a CLI that will grow many subcommands —
# it catches API-consistency and correctness-adjacent smells early. We keep it
# at "warn" (CI promotes warnings to errors via `-D warnings`) and allow-list
# the lints that fire too aggressively for this codebase's idioms.
pedantic = { level = "warn", priority = -1 }

# --- Allow-listed pedantic lints (documented rationale per item) ---
# Fires on `foo::Foo`-style paths that are conventional and readable here.
module_name_repetitions = "allow"
# We expose plain APIs; `#[must_use]` everywhere is noise for an internal tool.
must_use_candidate = "allow"
# Error/panic doc enforcement is deferred until the public API stabilises.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Numeric conversions here are deliberate (unix timestamps, byte counts, pids).
# The `cast_*` family flags every `as` regardless of intent and would force
# noisy `#[allow]` or `try_from().unwrap()` churn for no safety gain at our sizes.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Long command-handler / reducer functions are readable top-to-bottom; splitting
# them purely to satisfy a line count would hurt more than it helps right now.
too_many_lines = "allow"
# `match { Some(x) => x, None => ... }` vs `let...else` is a style preference;
# clippy itself marks these MaybeIncorrect. Not worth churning ~25 call sites.
manual_let_else = "allow"
# Many handlers take owned args they only borrow. Tightening every signature to
# `&T` ripples through callers for no real gain on a pre-1.0 internal CLI.
needless_pass_by_value = "allow"
# The flagged fields (e.g. `Node.node_id`, `ChildRef.run_id`) are part of the
# serialized on-disk schema — renaming them would break stored state files.
struct_field_names = "allow"
# Local enums/structs/`use`s are deliberately defined next to their use site
# (e.g. the lock-result enums in the discussion/report handlers) for locality.
items_after_statements = "allow"
# NOTE: `match_same_arms` is intentionally NOT allow-listed here — a global allow
# would hide copy-paste bugs in the reducer/dispatch matches. The few intentional
# all-variants-enumerated matches carry a local `#[allow(clippy::match_same_arms)]`.
