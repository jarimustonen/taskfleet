# Clippy configuration for Taskfleet.
#
# Lint *levels* (pedantic = warn, plus the allow-list) live in the root
# Cargo.toml `[workspace.lints.clippy]` table so they apply per-crate via
# `lints.workspace = true`. This file holds clippy's behavioural knobs only.

# The public API is pre-1.0 and unstable; let clippy suggest signature-level
# improvements (e.g. needless_pass_by_value) without treating breakage as a cost.
avoid-breaking-exported-api = false
