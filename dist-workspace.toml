[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Release code and credentials are never made reachable from pull requests.
# Phase B validates the generated tag-only topology locally; ordinary CI owns
# same-repository PR validation.
pr-run-mode = "skip"
# R9 restores the generated tag trigger at the canonical repository. The
# checked-in activation gate still blocks every publishing path until R10.
dispatch-releases = false
# Build setup derives path remapping from each runner's HOME so prebuilt
# binaries never expose the runner account or filesystem layout.
github-build-setup = "../build-setup.yml"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Sole generated Homebrew destination.
tap = "jarimustonen/homebrew-taskfleet"
# Authorization executes inside every local build via github-build-setup. An
# unauthorized tag therefore makes the build dependency fail (never skip), so
# cargo-dist's permissive skipped-build host condition cannot publish.
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# Taskfleet is tmux + git-worktree centric — POSIX-only by design.
# Windows is intentionally NOT a target; the supervisor uses fork(2),
# setsid(2), sigaction(2), and unix signal handlers throughout.
#
# x86_64-apple-darwin is intentionally NOT built: the available macOS
# release runner is Apple Silicon and lacks the rustup/x86_64 standard library
# needed to cross-compile the Intel target. Apple Silicon is fully covered;
# Intel-Mac users install from source via `cargo install`. Revisit if a
# cross-compilation-capable toolchain is added to the release runner.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"

# Route the macOS build to a self-hosted runner. GitHub-hosted macOS minutes
# are effectively unavailable on the Free plan (multi-hour queues); the two
# Linux targets stay on GitHub-hosted ubuntu runners.
#
# Runner requirement: do not override `GIT_CONFIG_GLOBAL`. `actions/checkout@v4`
# overrides HOME and expects its temporary authentication config under that
# home; an independent global-config override makes checkout write the token
# elsewhere and fail to replace its authentication placeholder.
[dist.github-custom-runners]
aarch64-apple-darwin = "macOS"
